[package]
name = "mouse-position-pinner"
version = "0.1.0"
description = "鼠标位置定位器 - 全局鼠标坐标置顶小窗"
authors = ["鼠标位置定位器"]
edition = "2021"

[lib]
name = "mouse_position_pinner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mouse_position = "0.1"

[profile.release]
codegen-units = 1
lto = true
strip = true
